name: AWS Lab Auth

on:
  push:
    branches:
      - infra/aws-manual-lab
    paths:
      - .github/workflows/aws-lab-auth.yml

permissions:
  contents: read

jobs:
  check-aws-identity:
    runs-on: ubuntu-latest
    environment: aws-lab

    permissions:
      contents: read
      id-token: write

    steps:
              - name: Inspect OIDC claims
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ["aud", "sub", "ref", "environment", "repository"]:
              print(f"{key}: {claims.get(key)}")
          PY
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show AWS identity
        run: aws sts get-caller-identity