name: AWS Lab Image

on:
  push:
    branches:
      - infra/aws-manual-lab

concurrency:
  group: aws-lab-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-lab

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Run integration tests
        run: npm run test:integration

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare image address
        id: image
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account --output text)"

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REPOSITORY_URI="${REGISTRY}/${ECR_REPOSITORY}"
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "repository_uri=${REPOSITORY_URI}" >> "$GITHUB_OUTPUT"
          echo "tagged_image=${REPOSITORY_URI}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          ECR_REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        id: publish
        env:
          TAGGED_IMAGE: ${{ steps.image.outputs.tagged_image }}
          REPOSITORY_URI: ${{ steps.image.outputs.repository_uri }}
        run: |
          set -euo pipefail

          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$TAGGED_IMAGE" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            --push \
            .

          DIGEST="$(jq -er '."containerimage.digest"' \
            "$RUNNER_TEMP/image-metadata.json")"

          APP_IMAGE="${REPOSITORY_URI}@${DIGEST}"

          echo "app_image=${APP_IMAGE}" >> "$GITHUB_OUTPUT"

          {
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Image tag: ${TAGGED_IMAGE}"
            echo
            echo "APP_IMAGE: ${APP_IMAGE}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Send SSM connection check
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          : "${EC2_INSTANCE_ID:?Set EC2_INSTANCE_ID in aws-lab variables}"

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions AWS lab connection check" \
            --timeout-seconds 60 \
            --parameters '{"commands":["set -eu","whoami","hostname","docker --version","docker compose version"],"executionTimeout":["60"]}' \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM Command ID: ${COMMAND_ID}"

          {
            echo
            echo "SSM connection check command: ${COMMAND_ID}"
            echo "Target instance: ${EC2_INSTANCE_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
