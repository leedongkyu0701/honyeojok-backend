name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

      confirmation:
        description: 'For production, type SEED_PRODUCTION'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      NODE_ENV: production
      APP_ENV: ${{ inputs.environment }}

      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_SSL: ${{ vars.DB_SSL }}

    steps:
      - name: Validate seed target
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENVIRONMENT" == "staging" ]]; then
            if [[ "$REF_NAME" != "develop" ]]; then
              echo "Staging seed must be run from the develop branch."
              exit 1
            fi
          fi

          if [[ "$TARGET_ENVIRONMENT" == "production" ]]; then
            if [[ "$REF_NAME" != "main" ]]; then
              echo "Production seed must be run from the main branch."
              exit 1
            fi

            if [[ "$CONFIRMATION" != "SEED_PRODUCTION" ]]; then
              echo "Production seed requires confirmation: SEED_PRODUCTION"
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate database configuration
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            DB_HOST
            DB_PORT
            DB_USER
            DB_PASSWORD
            DB_NAME
            DB_SSL
          )

          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required database configuration is missing: $variable"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify migration state
        shell: bash
        run: |
          set -euo pipefail

          migration_status="$(npm run migration:show:deploy 2>&1)"
          echo "$migration_status"

          if echo "$migration_status" | grep -q '\[ \]'; then
            echo "Pending migrations exist."
            echo "Run the normal deployment/migration process before seeding."
            exit 1
          fi

      - name: Seed database
        run: npm run seed:deploy
