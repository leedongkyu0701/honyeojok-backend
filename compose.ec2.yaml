services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  migrate:
    image: honyeojok-backend:local

    env_file:
      - .env.local

    command: ["npm", "run", "migration:run:deploy"]

    restart: "no"


  app:
    image: honyeojok-backend:local
    init: true
    restart: unless-stopped

    env_file:
      - .env.local

    environment:
      REDIS_URL: redis://redis:6379
      LOG_PRETTY: "false"

    ports:
      - "127.0.0.1:5001:5001"

    depends_on:
      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s